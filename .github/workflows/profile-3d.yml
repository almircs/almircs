name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # 18:00 UTC (15:00 em Brasília)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gerar gráfico 3D de contribuições
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          # Só faz commit quando o gráfico realmente mudou
          git diff --cached --quiet || git commit -m "chore: atualiza gráfico 3D de contribuições"
          git push
